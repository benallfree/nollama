name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['Formula/**', 'bucket/**', '**.md']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # every release target builds
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -e
          for t in linux/amd64 linux/arm64 linux/arm linux/s390x linux/ppc64le windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./...
          done
